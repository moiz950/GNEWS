{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-panel auth-art"><div><span class="eyebrow">Join NewsHub</span><h1>Your news. Your reading list.</h1><p>Create a free account to bookmark meaningful stories across every category.</p></div></div><div class="auth-panel"><form class="form-card" method="post"><h2>Create account</h2><div class="form-row"><div><label for="name">Full name</label><input id="name" name="name" value="{{ request.form.get('name','') }}" autocomplete="name" required></div><div><label for="username">Username</label><input id="username" name="username" value="{{ request.form.get('username','') }}" autocomplete="username" required></div></div><label for="email">Email</label><input id="email" type="email" name="email" value="{{ request.form.get('email','') }}" autocomplete="email" required><label for="password">Password</label><div class="password-field"><input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><label for="confirm_password">Confirm password</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required><button class="button button-primary button-block">Create account</button><p class="form-footer">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></div></section>{% endblock %}
