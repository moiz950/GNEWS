{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-panel auth-art"><div><span class="eyebrow">Welcome back</span><h1>Stay ahead of the story.</h1><p>Sign in to save important reporting and build your personal reading list.</p></div></div><div class="auth-panel"><form class="form-card" method="post"><h2>Login to NewsHub</h2><p>Enter your email or username.</p><label for="identity">Email or username</label><input id="identity" name="identity" autocomplete="username" required><label for="password">Password</label><div class="password-field"><input id="password" type="password" name="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><button class="button button-primary button-block">Login</button><p class="form-footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></div></section>{% endblock %}
